{% extends "base.html" %}
{% block title %}{{ SITENAME }} &mdash; Tags{% endblock %}
{% block content %}
<div class="wrap">
	<section class="listing-title">
		<p class="hero-kicker">Index</p>
		<h1>Tags</h1>
	</section>
	<ul class="plain-list">
	{% for tag, articles in tags|sort %}
		<li><a href="{{ SITEURL }}/{{ tag.url }}">#{{ tag.name }}</a></li>
	{% endfor %}
	</ul>
</div>
{% endblock %}
