{% extends "base.html" %}
{% block title %}{{ SITENAME }} &mdash; Archives{% endblock %}
{% block content %}
<div class="wrap">
	<section class="listing-title">
		<p class="hero-kicker">Index</p>
		<h1>Archives</h1>
	</section>
	<dl class="archive-dl">
	{% for article in dates %}
		<dt>{{ article.locale_date }}</dt>
		<dd><a href="{{ SITEURL }}/{{ article.url }}">{{ article.title }}</a></dd>
	{% endfor %}
	</dl>
</div>
{% endblock %}
