<article class="post-row">
	<div class="post-row-meta">
		<span class="post-row-date">{{ article.date.strftime('%d %b %Y') }}</span>
		<a class="post-row-cat" href="{{ SITEURL }}/{{ article.category.url }}" title="View all posts in {{ article.category }}">{{ article.category }}</a>
	</div>
	<div class="post-row-body">
		<h2 class="post-row-title">
			<a href="{{ SITEURL }}/{{ article.url }}" title="Permalink to {{ article.title|striptags }}" rel="bookmark">{{ article.title }}</a>
		</h2>
		<p class="post-row-excerpt">{{ article.summary|default(article.description, true)|striptags|truncate(300) }}</p>
		{% if article.tags %}
		<div class="tag-row">
			{% for tag in article.tags|sort %}<a href="{{ SITEURL }}/{{ tag.url }}" rel="tag">#{{ tag }}</a>{% endfor %}
		</div>
		{% endif %}
	</div>
</article>
