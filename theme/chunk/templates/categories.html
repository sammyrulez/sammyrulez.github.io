{% extends "base.html" %}
{% block title %}{{ SITENAME }} &mdash; Categories{% endblock %}
{% block content %}
<div class="wrap">
	<section class="listing-title">
		<p class="hero-kicker">Index</p>
		<h1>Categories</h1>
	</section>
	<ul class="plain-list">
	{% for category, articles in categories %}
		<li><a href="{{ SITEURL }}/{{ category.url }}">{{ category }}</a></li>
	{% endfor %}
	</ul>
</div>
{% endblock %}
